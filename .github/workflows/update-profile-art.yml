name: Update profile art

on:
  schedule:
    # 06:17 UTC daily. An off-the-hour minute avoids the queue that builds up
    # when thousands of scheduled workflows all ask for a runner at :00.
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # The public HTML calendar is served from a cache that can lag by a day,
      # which is how a deleted repo's contributions survived in the rendered
      # heatmap. The API reflects the real numbers, so hand the script a token.
      - name: Read the contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render the heatmap SVG
        run: python scripts/render_heatmap_svg.py

      # The avatar mosaic and the info card are hand-tuned and never change on a
      # schedule, so only the heatmap and its data are committed here.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg"
          # The action defaults the author to whoever triggered the run, which on
          # a schedule is the repo owner, so every daily refresh landed on the
          # contribution graph and inflated the very streak this heatmap reports.
          # Authoring as the bot keeps the graph a record of real work.
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
