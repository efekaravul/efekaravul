<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 525" width="860" height="525" role="img" aria-label="Featured machine learning notebooks by Efe Karavul"><style>.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}</style><rect x="0.5" y="0.5" width="859" height="524" rx="10" fill="#0d1117" stroke="#30363d"/><g><circle cx="20" cy="18" r="4.5" fill="#ff5f56"/><circle cx="36" cy="18" r="4.5" fill="#ffbd2e"/><circle cx="52" cy="18" r="4.5" fill="#27c93f"/><line x1="0" y1="36" x2="860" y2="36" stroke="#30363d"/><text class="mono" x="70" y="22" font-size="11" fill="#7ee787">efe@github<tspan fill="#c9d1d9">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#c9d1d9">$ ls -l ~/portfolio</tspan></text></g><g class="mono"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0017;0.0750;1" dur="6.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="-10 0;-10 0;0 0;0 0" keyTimes="0;0.0017;0.0750;1" dur="6.0s" repeatCount="indefinite"/><text x="18.0" y="64" font-size="12.5" font-weight="700" fill="#7ee787">used-car-price-adaboost</text><text x="842.0" y="64" font-size="10.5" fill="#6e7681" text-anchor="end">AdaBoost · 15,411 listings</text><text x="18.0" y="82" font-size="11" fill="#c9d1d9">Encoding picked by cardinality: one-hot for small columns, cross-fitted target encoding for 152 categories.</text><text x="18.0" y="98" font-size="11" fill="#ffa657">R² 0.63 → 0.91 once depth, learning rate and loss were tuned together</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0250;0.1000;1" dur="6.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="-10 0;-10 0;0 0;0 0" keyTimes="0;0.0250;0.1000;1" dur="6.0s" repeatCount="indefinite"/><text x="18.0" y="127" font-size="12.5" font-weight="700" fill="#7ee787">sms-spam-detection</text><text x="842.0" y="127" font-size="10.5" fill="#6e7681" text-anchor="end">MultinomialNB · 5,572 messages</text><text x="18.0" y="145" font-size="11" fill="#c9d1d9">Bag-of-words classification; leakage-safe CountVectorizer fit, duplicate removal, stratified split.</text><text x="18.0" y="161" font-size="11" fill="#ffa657">98.7% accuracy · 0.98 precision · 0.92 recall on a 13% minority class</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0500;0.1250;1" dur="6.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="-10 0;-10 0;0 0;0 0" keyTimes="0;0.0500;0.1250;1" dur="6.0s" repeatCount="indefinite"/><text x="18.0" y="190" font-size="12.5" font-weight="700" fill="#7ee787">diamond-price-regression</text><text x="842.0" y="190" font-size="10.5" fill="#6e7681" text-anchor="end">SVR · ~54k records</text><text x="18.0" y="208" font-size="11" fill="#c9d1d9">Support Vector Regression against a linear baseline, with outlier treatment, ordinal encoding and scaling.</text><text x="18.0" y="224" font-size="11" fill="#ffa657">Kernel, C and epsilon tuned with GridSearchCV</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0750;0.1500;1" dur="6.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="-10 0;-10 0;0 0;0 0" keyTimes="0;0.0750;0.1500;1" dur="6.0s" repeatCount="indefinite"/><text x="18.0" y="253" font-size="12.5" font-weight="700" fill="#7ee787">iris-species-naive-bayes</text><text x="842.0" y="253" font-size="10.5" fill="#6e7681" text-anchor="end">GaussianNB · 150 records</text><text x="18.0" y="271" font-size="11" fill="#c9d1d9">Why the distributional assumption drives model choice, with the assumptions checked before modelling.</text><text x="18.0" y="287" font-size="11" fill="#ffa657">Gaussian likelihood fits continuous measurements where multinomial does not</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1000;0.1750;1" dur="6.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="-10 0;-10 0;0 0;0 0" keyTimes="0;0.1000;0.1750;1" dur="6.0s" repeatCount="indefinite"/><text x="18.0" y="316" font-size="12.5" font-weight="700" fill="#7ee787">svm-kernel-trick</text><text x="842.0" y="316" font-size="10.5" fill="#6e7681" text-anchor="end">SVM · polynomial vs RBF</text><text x="18.0" y="334" font-size="11" fill="#c9d1d9">Polynomial features engineered by hand and visualised in 3D, then the same split found implicitly by a kernel.</text><text x="18.0" y="350" font-size="11" fill="#ffa657">100% test accuracy with RBF against 40% with a linear kernel</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1250;0.2000;1" dur="6.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="-10 0;-10 0;0 0;0 0" keyTimes="0;0.1250;0.2000;1" dur="6.0s" repeatCount="indefinite"/><text x="18.0" y="379" font-size="12.5" font-weight="700" fill="#7ee787">titanic-lightgbm</text><text x="842.0" y="379" font-size="10.5" fill="#6e7681" text-anchor="end">LightGBM · 891 passengers</text><text x="18.0" y="397" font-size="11" fill="#c9d1d9">FarePerPerson engineered from ticket-sharing count, not family size; tuned via RandomizedSearchCV.</text><text x="18.0" y="413" font-size="11" fill="#ffa657">Corrected recall on survivors: 0.67, not the printed 0.84</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1500;0.2250;1" dur="6.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="-10 0;-10 0;0 0;0 0" keyTimes="0;0.1500;0.2250;1" dur="6.0s" repeatCount="indefinite"/><text x="18.0" y="442" font-size="12.5" font-weight="700" fill="#7ee787">medical-cost-lightgbm</text><text x="842.0" y="442" font-size="10.5" fill="#6e7681" text-anchor="end">LightGBM · 1,337 records</text><text x="18.0" y="460" font-size="11" fill="#c9d1d9">Baseline vs tuned vs Box-Cox-transformed target, benchmarked with a corrected r2_score.</text><text x="18.0" y="476" font-size="11" fill="#ffa657">R² 0.85 → 0.87; untuned Box-Cox beat the tuned RandomizedSearchCV model</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1750;0.2500;1" dur="6.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="-10 0;-10 0;0 0;0 0" keyTimes="0;0.1750;0.2500;1" dur="6.0s" repeatCount="indefinite"/><line x1="18.0" y1="491" x2="842.0" y2="491" stroke="#21262d"/><text x="18.0" y="511" font-size="10.5" fill="#8b949e">Every notebook is documented bilingually (TR / EN) — the reasoning, not just the code.</text></g></g></svg>